<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Polytrader{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-active { color: white; border-bottom: 2px solid #3b82f6; }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="gradient-bg min-h-screen text-white">
    <header class="border-b border-white/10 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-8">
                <a href="/" class="text-2xl font-bold flex items-center gap-2">
                    <span class="text-3xl">&#9729;</span>
                    Polytrader
                </a>
                <nav class="flex gap-6">
                    <a href="/" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/' else '' }}">Dashboard</a>
                    <a href="/live" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/live' else '' }}">Live</a>
                    <a href="/positions" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/positions' else '' }}">Positions</a>
                    <a href="/trades" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/trades' else '' }}">Trades</a>
                    <a href="/opportunities" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/opportunities' else '' }}">Opportunities</a>
                    <a href="/analytics" class="text-gray-300 hover:text-white pb-1 {{ 'nav-active' if request.url.path == '/analytics' else '' }}">Analytics</a>
                </nav>
            </div>
            <div class="flex items-center gap-4 text-sm text-gray-400">
                <span id="clock"></span>
                <span class="w-2 h-2 bg-green-500 rounded-full pulse-dot"></span>
            </div>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
    <footer class="border-t border-white/10 px-6 py-4 mt-8">
        <div class="max-w-7xl mx-auto text-center text-gray-500 text-sm">
            Polytrader Weather Trading Bot | Data refreshes every 30 seconds
        </div>
    </footer>
    <script>
        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString();
        }
        updateClock();
        setInterval(updateClock, 1000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
