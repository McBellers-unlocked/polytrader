<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Polytrader{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%); }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <header class="border-b border-white/10 px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center gap-8">
            <a href="/" class="text-2xl font-bold">Polytrader</a>
            <nav class="flex gap-6">
                <a href="/" class="text-gray-300 hover:text-white">Dashboard</a>
                <a href="/positions" class="text-gray-300 hover:text-white">Positions</a>
                <a href="/trades" class="text-gray-300 hover:text-white">Trades</a>
                <a href="/opportunities" class="text-gray-300 hover:text-white">Opportunities</a>
            </nav>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
